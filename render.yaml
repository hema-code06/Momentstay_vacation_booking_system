services:
  - type: web
    name: momentstay-vacation-booking-system
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: CLIENT_ORIGIN
        value: https://momentstay-vacation-booking-system.vercel.app
    healthCheckPath: /
